name: Weekly blog post

on:
  schedule:
    # Thursdays 14:00 UTC — about 9:00 AM EST / 10:00 AM EDT.
    - cron: '0 14 * * 4'
  workflow_dispatch:

# One draft at a time. A second run waits; it does not cancel a post that is
# already in progress, and this workflow never pushes to master.
concurrency:
  group: weekly-blog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutrilogix-landing-react
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutrilogix-landing-react/package-lock.json

      - name: Generate blog post
        id: generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/generate-blog-post.mjs

      - name: Install, build, and prerender
        run: npm ci && npm run build

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          POST_SLUG: ${{ steps.generate.outputs.slug }}
          POST_DATE: ${{ steps.generate.outputs.date }}
          POST_TITLE: ${{ steps.generate.outputs.title }}
          POST_EXCERPT: ${{ steps.generate.outputs.excerpt }}
        run: |
          set -euo pipefail
          if [ -z "${POST_SLUG}" ] || [ -z "${POST_DATE}" ] || [ -z "${POST_TITLE}" ]; then
            echo "Generator did not report a slug, date, and title."
            exit 1
          fi
          BRANCH="blog/${POST_DATE}-${POST_SLUG}"
          if ! printf '%s' "$BRANCH" | grep -Eq '^blog/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$'; then
            echo "Refusing unsafe branch name: ${BRANCH}"
            exit 1
          fi
          case "$BRANCH" in
            master|main|refs/heads/master|refs/heads/main)
              echo "Refusing to push to ${BRANCH}"
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCH" ]; then
            echo "Refusing to commit because HEAD is not ${BRANCH}"
            exit 1
          fi
          git add src/data/generatedPosts.js
          if git diff --staged --quiet; then
            echo "Generator did not change generatedPosts.js"
            exit 1
          fi
          git commit -m "content(blog): ${POST_TITLE}"
          # Push only the new blog branch. Never push HEAD to master.
          git push origin "HEAD:refs/heads/${BRANCH}"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs"
            const title = process.env.POST_TITLE
            const excerpt = process.env.POST_EXCERPT || ""
            writeFileSync("/tmp/weekly-blog-pr.md", [
              `## ${title}`,
              "",
              excerpt,
              "",
              "Generated by the weekly blog workflow using xAI. Review the sources and the not-medical-advice line before merging.",
              "",
              "This pull request is the publish path. The workflow does not push to `master`.",
              "",
            ].join("\n"))
          '
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "content(blog): ${POST_TITLE}" \
            --body-file /tmp/weekly-blog-pr.md
